name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # The full local test suite includes Windows shortcut / COM smoke tests that
      # are meant for a real desktop session. Public CI only runs the release-safe
      # contract tests and package surface checks.
      - run: npm run test:ci
      - run: npm pack --dry-run --json
