name: 使用问题 / 恢复路径咨询
description: 不确定下一步该点什么、该走哪条恢复路径，或需要确认工具边界时使用
title: "support: "
labels:
  - support
  - needs-info
body:
  - type: markdown
    attributes:
      value: |
        如果是崩溃、报错或明确 bug，请优先使用 Bug 报告模板。如果是历史不显示或侧栏异常，请使用 Desktop 历史会话不显示模板。维护者会按 `docs/feedback-triage.md` 分流。
        
        请不要粘贴密钥、`auth.json` 原文、账号令牌、token、`encrypted_content` 原文、完整本地历史文件或私有代理 URL 的 token query。
  - type: input
    id: version
    attributes:
      label: Codex Pro 版本
      placeholder: v0.2.5
    validations:
      required: true
  - type: dropdown
    id: goal
    attributes:
      label: 你想做什么
      options:
        - 当前 provider 不变，只修复历史可见性
        - 继续正常打开 Codex，但历史没显示完整
        - 从备份恢复最近快照
        - 想确认固定恢复路径下一步该点什么
        - 不确定应该怎么选
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 / Windows 10 22H2
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex Desktop 版本或大概更新时间
      placeholder: Codex Desktop，版本未知
    validations:
      required: false
  - type: dropdown
    id: install_method
    attributes:
      label: Codex Pro 安装方式
      options:
        - release 包 / 绿色包
        - 仓库源码运行
        - npm 包
        - 不确定
        - 其它
    validations:
      required: true
  - type: dropdown
    id: current_mode
    attributes:
      label: 当前模式
      options:
        - takeover_injection
        - takeover_compatibility
        - maintenance
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: opened_history
    attributes:
      label: 是否已经在 Codex 里点击“历史”
      options:
        - 是
        - 否
        - 不确定
    validations:
      required: true
  - type: input
    id: current_provider
    attributes:
      label: 当前 provider（仅供诊断）
      placeholder: openai / dal / apigather
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: status / 历史诊断文本
      description: 有输出请完整粘贴；没有输出请说明卡在哪一步。
      render: text
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: 具体问题
      placeholder: 描述你现在的状态、已经尝试过什么、想达到什么结果。优先按“继续打开 Codex -> 历史 -> 修复历史显示 -> 重建历史索引 -> 打开高级修复”的顺序描述。
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 确认事项
      options:
        - label: 我理解工具不会自动修改登录账号，也不会处理 auth.json。
          required: true
        - label: 我理解 encrypted_content 跨 provider/account 后可能只能恢复可见性。
          required: true
        - label: 我不会在 issue 里粘贴密钥、auth.json 原文、token、完整本地历史文件或 encrypted_content 原文。
          required: true


